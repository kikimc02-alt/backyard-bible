<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backyard Bible 🌿</title><style>:root{font-family:system-ui,sans-serif;background:#e8eee6;color:#2d493a}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;background:#f8f6ef;min-height:100vh;padding:25px 23px 85px}h1{font-size:34px;line-height:1.15}h2{font-size:21px}p{line-height:1.55;color:#657b6d}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:#3e7057}.card{background:white;border:1px solid #e4e9e1;border-radius:18px;padding:19px;margin:14px 0}.soft{background:#e9efe4}.hero{height:150px;display:grid;place-items:center;background:linear-gradient(130deg,#e3eddf,#c6d8bf);border-radius:22px;font-size:65px}.btn{display:block;width:100%;border:0;background:#3e7057;color:white;padding:15px;border-radius:14px;margin:12px 0;font-weight:700;font-size:15px}.alt{background:#e2ebde;color:#3e7057}.line{background:white;color:#3e7057;border:1px solid #b6cab8}.item{display:flex;gap:12px;align-items:center}.item b{flex:1}.item span{font-size:30px}small{color:#718075}input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid #cbd8c9;border-radius:12px;font:inherit}textarea{min-height:90px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:white;border-top:1px solid #dce7d9}.nav button{flex:1;background:none;border:0;padding:12px 2px;color:#3e7057;font-size:12px}.pill{display:inline-block;border:1px solid #b9cdb8;border-radius:20px;padding:9px;margin:4px;background:#fff;color:#3e7057}.selected{background:#3e7057;color:white}.progress{height:10px;border-radius:9px;background:#d4dfd0;overflow:hidden}.progress i{display:block;height:100%;background:#3e7057}</style></head><body><main id="app"></main><script>
const K='backyard-bible-web-v1';const initial={page:'welcome',space:'Backyard',goals:[],location:'',pace:10,budget:'Free',tenure:'Own',pets:false,kids:false,done:[],garden:[],saved:[],zones:['Sunny corner','Patio & pots'],notes:{},checks:{},shopping:[],adventure:0};let d;try{d={...initial,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{d={...initial}}
const plants=[['Basil','Herb','☀️'],['Rosemary','Herb','🌿'],['Thyme','Herb','🌿'],['Mint','Herb','🍃'],['Parsley','Herb','🌿'],['Chives','Herb','🌿'],['Oregano','Herb','🌿'],['Sage','Herb','🌿'],['Coriander','Herb','🌿'],['Lemon balm','Herb','🍃'],['Cherry tomato','Edible','🍅'],['Strawberry','Edible','🍓'],['Lettuce','Edible','🥬'],['Silverbeet','Edible','🥬'],['Radish','Edible','🥕'],['Rocket','Edible','🥬'],['Chilli','Edible','🌶️'],['Spring onion','Edible','🌱'],['Nasturtium','Flower','🌼'],['Calendula','Flower','🌼'],['Marigold','Flower','🌼'],['Zinnia','Flower','🌸'],['Viola','Flower','🌸'],['Lavender','Flower','💜'],['Sunflower','Flower','🌻'],['Kangaroo paw','Native','🌾'],['Westringia','Native','🌿'],['Grevillea','Native','🌺'],['Bottlebrush','Native','🌺'],['Native violet','Native','🌸']];
const tasks=[['Find your sunniest spot','☀️',10,'Free','Notice where the sunlight falls during the day.','Observe the morning light|Check again later|Note the brightest corner'],['Take a before photo','📸',10,'Free','Capture the start of your sanctuary.','Choose one corner|Take a photo|Keep it for later'],['Choose one little zone','🗺️',10,'Free','Start with a small, manageable area.','Walk outside|Pick one area|Give it a name'],['A five-minute tidy','🧹',10,'Free','Refresh a tiny corner.','Pick up five stray items|Put them away|Enjoy the difference'],['Find your shady corner','🌤️',10,'Free','Notice where shade settles.','Walk around|Find a cool spot|Make a note'],['Listen to your garden','🐦',10,'Free','Enjoy a quiet outdoor moment.','Step outside|Listen|Notice what feels peaceful'],['Pick a colour palette','🎨',10,'Free','Choose two colours that make you smile.','Find inspiration|Pick two colours|Save your idea'],['Find your water source','💧',10,'Free','Plan how you might water plants.','Locate a tap|Check the distance|Make a note'],['Plan a herb pot','🌿',30,'Low','Imagine a small herb garden.','Choose a sunny spot|Check local seasons|Find a draining pot'],['Arrange movable pots','🪴',30,'Low','Try a new layout.','Gather existing pots|Arrange them|Keep paths clear'],['Make an inspiration board','🌼',30,'Free','Collect three ideas you love.','Find three pictures|Spot a theme|Choose one detail'],['Sort garden supplies','🧺',30,'Free','See what you already own.','Gather supplies|Sort them|Write down what is missing'],['Create a cosy pause spot','🪑',30,'Free','Make a place to sit.','Find a chair|Try a sheltered spot|Enjoy five minutes'],['Plan a pollinator corner','🦋',30,'Free','Explore local flowering plants.','Research native plants|Check suitability|Check pet safety'],['Check pot drainage','🪴',10,'Free','Help a plant avoid soggy roots.','Inspect the pot|Check drainage holes|Decide what it needs'],['Notice windy spots','🍃',10,'Free','Get to know your outdoor breeze.','Watch leaves move|Find exposed areas|Find shelter']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(d))}function go(p){d.page=p;save();render();scrollTo(0,0)}function set(k,v){d[k]=v;save();render()}function toggle(k,v){d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):[...d[k],v];save();render()}function b(t,call,cl=''){return '<button class="btn '+cl+'" onclick="'+call+'">'+t+'</button>'}function head(){return '<div class="brand">✳ BACKYARD BIBLE</div>'}function nav(){return '<div class="nav"><button onclick="go(\'home\')">☀️<br>Today</button><button onclick="go(\'sanctuary\')">🌱<br>Sanctuary</button><button onclick="go(\'zones\')">▦<br>My Space</button><button onclick="go(\'ideas\')">♡<br>Ideas</button></div>'}function choices(k,opts){return opts.map(x=>b((d[k]===x?'✓ ':'')+x,"set('"+k+"','"+x+"')",d[k]===x?'':'alt')).join('')}function current(){let a=tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')&&!d.done.includes(t[0]));return a[d.adventure%Math.max(1,a.length)]}
function screen(){let p=d.page,s=head();if(p==='welcome')return s+'<h1>Your sanctuary starts today. 🌿</h1><p>Beautiful outdoor spaces, without the overwhelm.</p><div class="hero">🌱☀️🪴</div><h2>One little adventure at a time.</h2><p>No pressure, no perfection. Just progress.</p>'+b('Create My Sanctuary',"go('setup')");if(p==='setup')return s+'<h1>Let’s make this yours 🌼</h1><p>Choose what feels right. You can change your mind later.</p><h2>Your space</h2>'+choices('space',['Backyard','Courtyard','Balcony','Acreage'])+'<h2>Your pace</h2>'+[10,30,60].map(n=>b((d.pace===n?'✓ ':'')+n+' minutes',"set('pace',"+n+")",d.pace===n?'':'alt')).join('')+'<h2>Budget</h2>'+choices('budget',['Free','Low'])+'<h2>Rent or own?</h2>'+choices('tenure',['Rent','Own'])+'<h2>Suburb or postcode</h2><input placeholder="e.g. Perth, WA" value="'+esc(d.location)+'" oninput="d.location=this.value;save()"><h2>What are you dreaming of?</h2>'+['Peaceful retreat','Grow something good','Make it beautiful','Gather and connect','A fresh start'].map(x=>b((d.goals.includes(x)?'✓ ':'')+x,"toggle('goals','"+x+"')",d.goals.includes(x)?'':'alt')).join('')+'<h2>Sharing with pets or kids?</h2>'+b(d.pets?'✓ Pets':'Pets',"set('pets',"+!d.pets+")",'alt')+b(d.kids?'✓ Children':'Children',"set('kids',"+!d.kids+")",'alt')+b('Find My First Adventure',"go('home')");
if(p==='home'){let t=current();return s+'<h1>A little adventure for today ☀️</h1><p>One step is plenty. Your sanctuary can wait whenever you need a break.</p><div class="card soft"><b>YOUR JOURNEY</b><h2>🌱 '+(d.done.length<3?'Sprouting':d.done.length<10?'Growing':'Blooming')+'</h2><div class="progress"><i style="width:'+Math.min(100,d.done.length*5)+'%"></i></div><small>'+d.done.length+' adventures completed</small></div><div class="card"><small>TODAY’S ADVENTURE</small><div class="hero">'+(t?t[1]:'🌼')+'</div><h2>'+(t?esc(t[0]):'Your sanctuary is blooming!')+'</h2><p>'+(t?esc(t[4]):'You have completed all your current adventures.')+'</p>'+(t?'<small>'+t[2]+' min · '+t[3]+'</small>'+b('Explore this adventure',"go('adventure')"):'')+'</div>'+b('↻ Another adventure','another()','alt')+b('🌱 My Garden',"go('garden')",'alt')+b('Browse adventures',"go('tasks')",'line')+nav()}
if(p==='adventure'){let t=current();return s+'<div class="hero">'+(t?t[1]:'🌼')+'</div><h1>'+(t?esc(t[0]):'All done!')+'</h1><p>'+(t?esc(t[4]):'Enjoy your sanctuary.')+'</p><h2>Your little steps</h2>'+(t?t[5].split('|').map((x,i)=>'<div class="card">'+(i+1)+'. '+esc(x)+'</div>').join(''):'')+b('I did it! 🌼','finish()')+b('Back',"go('home')",'alt')}
if(p==='celebrate')return s+'<div class="hero">🎉🌼</div><h1>Look at you, growing!</h1><p>One more little step for your sanctuary.</p><h2>'+d.done.length+' adventures completed</h2>'+b('Back to My Sanctuary',"go('home')");
if(p==='tasks')return s+'<h1>Little Adventures ☀️</h1><p>Small ideas to help your sanctuary grow.</p>'+tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')).map(t=>'<div class="card item"><span>'+t[1]+'</span><b>'+esc(t[0])+'<br><small>'+t[2]+' min · '+(d.done.includes(t[0])?'✓ Complete':t[3])+'</small></b></div>').join('')+nav();
if(p==='sanctuary')return s+'<h1>Your sanctuary is blooming 🌼</h1><div class="card soft"><h2>'+d.done.length+' little victories</h2><p>There is no falling behind here.</p></div>'+b('Visit My Garden',"go('garden')")+b('Explore Plants',"go('plants')",'alt')+nav();
if(p==='zones')return s+'<h1>My Outdoor Space 🏡</h1><p>'+esc(d.space)+' · '+esc(d.location||'Location not set')+'</p><div class="card soft"><h2>'+d.zones.length+' little zones 🌿</h2><p>Give each corner its own personality. No rush.</p></div>'+d.zones.map((z,i)=>{let info=zoneData(z);return '<div class="card"><div class="item"><span>🌿</span><b>'+esc(z)+'<br><small>'+esc(info.sun||'Sunlight unknown')+' · '+esc(info.stage||'Just dreaming')+'</small></b></div>'+(info.photo?'<img src="'+info.photo+'" alt="Zone photo" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-top:12px">':'')+'<p>'+esc(info.vision||'A little corner full of possibility.')+'</p>'+b('Explore this zone',"openZone("+i+")",'alt')+'</div>'}).join('')+'<div class="card"><h2>✨ Add a zone</h2><input id="zone" maxlength="50" placeholder="e.g. Shady patio">'+b('Add Zone','addZone()')+'</div>'+nav();
if(p==='zoneDetail'){let z=d.activeZone,info=zoneData(z);if(!d.zones.includes(z))return s+b('Back',"go('zones')");return s+b('‹ My Space',"go('zones')",'line')+'<h1>'+esc(z)+' 🌿</h1><p>Plan this corner at your own pace.</p><div class="card"><h2>📸 Your corner</h2>'+(info.photo?'<img alt="Zone photo" src="'+info.photo+'" style="width:100%;max-height:230px;object-fit:cover;border-radius:12px">':'<div class="hero">📷</div>')+'<input type="file" accept="image/*" onchange="zonePhoto(event)"><small>Photo is saved only in this browser. Clearing browser data may erase it.</small>'+(info.photo?b('Remove photo',"zoneField('photo','')",'line'):'')+'</div><div class="card"><h2>🌤️ About this spot</h2><label>Sunlight<select onchange="zoneField(this.name,this.value)" name="sun">'+zoneOptions(['Not sure yet','Full sun','Part sun','Mostly shade'],info.sun)+'</select></label><label>Purpose<select onchange="zoneField(this.name,this.value)" name="purpose">'+zoneOptions(['Not sure yet','Relaxing','Growing food','Flowers & beauty','Gathering','Practical space'],info.purpose)+'</select></label><label>Progress<select onchange="zoneField(this.name,this.value)" name="stage">'+zoneOptions(['Just dreaming','Planning','Getting started','Growing nicely','Feeling finished'],info.stage)+'</select></label></div><div class="card"><h2>💭 Your vision</h2><textarea name="vision" oninput="zoneField(this.name,this.value)" placeholder="What could this corner become?">'+esc(info.vision||'')+'</textarea><h2>📝 Notes</h2><textarea name="notes" oninput="zoneField(this.name,this.value)" placeholder="Wind, soil, measurements, ideas...">'+esc(info.notes||'')+'</textarea><small>Changes save on this device.</small></div>'+plannerSection(info)+b('Remove this zone','deleteZone()','line')+nav()}
if(p==='ideas')return s+'<h1>Ideas for your sanctuary ♡</h1><p>Explore without making a giant to-do list.</p><div class="card"><h2>🌿 Plant Library</h2><p>Explore 30 starter plants, from herbs to native flowers.</p>'+b('Explore Plants',"go('plants')")+'</div>'+b('🌱 My Garden',"go('garden')",'alt')+b('♡ Saved Plants',"go('saved')",'alt')+b('🧺 Shopping List',"go('shopping')",'alt')+nav();
if(p==='plants'||p==='saved'){let list=p==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;return s+'<h1>'+(p==='saved'?'Saved Plants ♡':'Plant Library 🌿')+'</h1><p>Growing ideas, not a planting prescription. Check local season and pet safety before buying.</p><input placeholder="Search plants..." oninput="filter(this.value)"><div id="plantlist">'+list.map(plantRow).join('')+'</div>'+nav()}
if(p.startsWith('plant:')){let x=plants.find(z=>z[0]===p.slice(6));if(!x)return '';return s+'<div class="hero">'+x[2]+'</div><h1>'+esc(x[0])+'</h1><p>'+x[1]+' · Explore whether this plant suits your light, soil, climate and available space.</p><div class="card"><b>🌤️ Local suitability</b><p>Check a local gardening guide for planting season and watering needs.</p><b>🐾 Pet safety</b><p>Not verified for this exact species or cultivar. Check veterinary toxicity guidance before placing within pets’ reach.</p></div>'+b(d.garden.includes(x[0])?'✓ In My Garden':"🌱 I'm Growing This","toggle('garden','"+x[0]+"')")+b(d.saved.includes(x[0])?'♥ Saved':'♡ Save for Later',"toggle('saved','"+x[0]+"')",'alt')+b('Back to Library',"go('plants')",'line')+nav()}
if(p==='garden')return s+'<h1>My Garden 🌱</h1><p>Your growing plants, at your pace. No overdue tasks.</p><div class="card soft"><h2>'+d.garden.length+' plants growing</h2></div>'+(d.garden.length?d.garden.map(n=>'<div class="card item"><span>🌿</span><b>'+esc(n)+'<br><small>'+((d.checks[n]||0))+' gentle check-ins</small></b><button class="pill" onclick="go(\'gplant:'+encodeURIComponent(n)+'\')">Visit</button></div>').join(''):'<div class="card">Your first green friend is waiting in the Plant Library. 🌿</div>')+b('Browse Plants',"go('plants')")+nav();
if(p.startsWith('gplant:')){let n=decodeURIComponent(p.slice(7));return s+'<div class="hero">🌿</div><h1>'+esc(n)+'</h1><p>Take a moment to notice new leaves, the soil and the light.</p><div class="card"><h2>A gentle check-in</h2><p>No reminders, no guilt. Check when it feels right.</p>'+b('I checked my plant',"check('"+n+"')")+'<small>'+(d.checks[n]||0)+' check-ins so far</small></div><h2>Little observations</h2><textarea oninput="d.notes['+JSON.stringify(n)+']=this.value;save()" placeholder="New leaves, first flower, things to try...">'+esc(d.notes[n]||'')+'</textarea>'+b('Back to My Garden',"go('garden')",'alt')+nav()}
if(p==='shopping')return s+'<h1>Your Little List 🧺</h1><p>Start with what you already have.</p>'+['Gardening gloves','Pot with drainage','Potting mix','Watering can','A plant you love'].map(x=>'<div class="card"><label><input type="checkbox" style="width:20px" '+(d.shopping.includes(x)?'checked':'')+' onchange="toggle(\'shopping\',\''+x+'\')"> '+x+'</label></div>').join('')+nav();return s+b('Go Home',"go('home')")}
function plantRow(x){return '<div class="card item"><span>'+x[2]+'</span><b>'+esc(x[0])+'<br><small>'+x[1]+'</small></b><button class="pill" onclick="go(\'plant:'+esc(x[0])+'\')">View</button></div>'}function filter(q){let p=d.page==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;document.getElementById('plantlist').innerHTML=p.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(plantRow).join('')}

function planShape(info){let points=info.boundary||[[4,4],[96,4],[96,96],[4,96]];return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><polygon points="'+points.map(p=>p.join(',')).join(' ')+'" fill="#b6d3a966" stroke="#3e7057" stroke-width="0.8" stroke-dasharray="2 1"/></svg>'}
function planDims(info){return {w:Math.max(1,Number(info.planWidth)||5),h:Math.max(1,Number(info.planLength)||5)}}
function planItemSize(x,info){let dims=planDims(info);return {w:x.mw?Math.max(5,x.mw/dims.w*100)+'%':(x.width||54)+'px',h:x.mh?Math.max(5,x.mh/dims.h*100)+'%':(x.height||54)+'px'}}
function planSetup(info){let dims=planDims(info);return '<div class="card soft"><h3>📐 Your space</h3><p>Start with a simple rectangle, or sketch your own outline. Measurements are optional until you know them.</p><label>Width (metres)<input type="number" min="1" max="100" step="0.1" value="'+dims.w+'" data-plan-dim="planWidth"></label><label>Length (metres)<input type="number" min="1" max="100" step="0.1" value="'+dims.h+'" data-plan-dim="planLength"></label><small>Default: 5 × 5 m. Dimensions control the scale of measured objects.</small><div style="display:flex;gap:8px">'+b('▭ Rectangle',"setPlanDrawing(false)",'alt')+b('✏️ Draw outline',"setPlanDrawing(true)",'alt')+'</div>'+(d.planDrawing?'<p><b>Drawing mode:</b> Tap the grid to mark corners, then choose Finish. Add at least 3 corners.</p>'+b('✓ Finish outline','finishPlanOutline()')+b('Cancel drawing','cancelPlanOutline()','line'):'')+'</div>'}
function setPlanDrawing(on){d.planDrawing=on;d.draftBoundary=[];render()}
function cancelPlanOutline(){d.planDrawing=false;d.draftBoundary=[];render()}
function finishPlanOutline(){if((d.draftBoundary||[]).length<3){alert('Tap at least three corners on the grid first.');return}zoneField('boundary',d.draftBoundary);d.planDrawing=false;d.draftBoundary=[];render()}
function planBoardTap(ev){if(!d.planDrawing||ev.target.closest('[data-item]'))return;let rect=ev.currentTarget.getBoundingClientRect();let x=Math.max(0,Math.min(100,Math.round((ev.clientX-rect.left)/rect.width*100))),y=Math.max(0,Math.min(100,Math.round((ev.clientY-rect.top)/rect.height*100)));d.draftBoundary=d.draftBoundary||[];d.draftBoundary.push([x,y]);render()}
document.addEventListener('change',function(ev){let item=ev.target.closest&&ev.target.closest('[data-item-dim]');if(item){setPlanItemDimension(item.getAttribute('data-item-dim'),item.value);return}let el=ev.target.closest&&ev.target.closest('[data-plan-dim]');if(!el)return;let value=Number(el.value);if(!Number.isFinite(value)||value<1||value>100){alert('Enter a measurement between 1 and 100 metres.');return}zoneField(el.getAttribute('data-plan-dim'),value);render()});
function setPlanItemDimension(axis,value){let v=Number(value);if(!Number.isFinite(v)||v<0.1||v>30){alert('Enter a size between 0.1 and 30 metres.');return}let info=zoneData(d.activeZone),dims=planDims(info),items=(info.layout||[]).map(x=>{if(x.id!==d.selectedPlanItem)return x;return {...x,mw:axis==='mw'?v:(x.mw||((x.width||54)/320*dims.w)),mh:axis==='mh'?v:(x.mh||((x.height||54)/320*dims.h))}});zoneField('layout',items);render()}
function planVisual(x){let n=x.name||'',kind=n.toLowerCase(),svg='';if(kind.includes('pot'))svg='<circle cx="50" cy="50" r="41" fill="#ba8461" stroke="#835b43" stroke-width="6"/><circle cx="50" cy="50" r="31" fill="#6b4d36"/><path d="M50 24 Q27 41 50 53 Q73 41 50 24M50 53 Q32 65 39 77 Q57 72 50 53M50 53 Q68 62 62 77 Q47 73 50 53" fill="#659c64" stroke="#3f7046" stroke-width="2"/>';else if(kind.includes('tree'))svg='<circle cx="50" cy="50" r="43" fill="#729e63" stroke="#3c704a" stroke-width="5"/><circle cx="36" cy="38" r="22" fill="#9dc18b"/><circle cx="64" cy="42" r="23" fill="#52875a"/><circle cx="49" cy="64" r="20" fill="#77a967"/>';else if(kind.includes('flower'))svg='<rect x="3" y="8" width="94" height="84" rx="8" fill="#a27c57" stroke="#74583f" stroke-width="5"/><rect x="11" y="16" width="78" height="68" rx="4" fill="#654b39"/>'+[[28,32],[66,31],[48,64],[76,65],[23,67]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="#e4a6a7" stroke="#c97c88" stroke-width="2"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#e9ca5e"/>').join('');else if(kind.includes('veggie'))svg='<rect x="3" y="8" width="94" height="84" rx="7" fill="#b18b61" stroke="#785b3e" stroke-width="5"/><rect x="11" y="16" width="78" height="68" fill="#654b39"/>'+[27,50,73].map(a=>'<path d="M'+a+' 22 Q'+(a-12)+' 40 '+a+' 51 Q'+(a+12)+' 39 '+a+' 22M'+a+' 48 Q'+(a-10)+' 65 '+a+' 77 Q'+(a+12)+' 65 '+a+' 48" fill="#6baf64" stroke="#4a8649" stroke-width="2"/>').join('');else if(kind.includes('seat'))svg='<rect x="16" y="17" width="68" height="22" rx="5" fill="#b98955" stroke="#795534" stroke-width="4"/><rect x="16" y="47" width="68" height="35" rx="6" fill="#c79a65" stroke="#795534" stroke-width="4"/><path d="M35 48V80M56 48V80" stroke="#8c623f" stroke-width="4"/>';else if(kind.includes('path'))svg='<rect x="5" y="5" width="90" height="90" rx="6" fill="#b3b3a6"/>'+[9,37,65].map(a=>'<rect x="12" y="'+a+'" width="76" height="23" rx="3" fill="#d4d1c4" stroke="#97968c" stroke-width="2"/>').join('');else if(kind.includes('shade'))svg='<path d="M50 10L91 72H9Z" fill="#e8c98b" stroke="#ae9365" stroke-width="5"/><path d="M50 10V90" stroke="#866b4b" stroke-width="5"/>';else if(kind.includes('water'))svg='<path d="M50 7 Q82 46 82 64 A32 32 0 1 1 18 64 Q18 46 50 7" fill="#8cc3d0" stroke="#528d9e" stroke-width="5"/><path d="M28 65 Q44 54 70 65" fill="none" stroke="#d9f0ef" stroke-width="5"/>';else return '<span aria-hidden="true">'+(x.icon||'🌿')+'</span>';return '<svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;pointer-events:none">'+svg+'</svg>'}
function plannerSection(info){let mode=d.planMode||'map',items=info.layout||[],selected=items.find(x=>x.id===d.selectedPlanItem);return '<div class="card"><h2>🗺️ Visual Garden Planner</h2><p>Design your corner two ways. Move things before spending a cent.</p>'+planSetup(info)+'<div style="display:flex;gap:8px">'+b('🗺️ Bird’s-eye',"planMode('map')",mode==='map'?'':'alt')+b('📸 Photo',"planMode('photo')",mode==='photo'?'':'alt')+'</div>'+(mode==='photo'&&!info.photo?'<p><small>Add a photo of this zone above to see it here.</small></p>':'')+'<div id="planBoard" onclick="planBoardTap(event)" style="position:relative;touch-action:none;overflow:hidden;aspect-ratio:1/1;width:100%;border:2px solid #bdd0b8;border-radius:14px;background:'+(mode==='map'?'repeating-linear-gradient(0deg,transparent 0 23px,#d8e6d5 24px),repeating-linear-gradient(90deg,#edf3e9 0 23px,#d8e6d5 24px)':'#e7eee3')+';'+(mode==='photo'&&info.photo?'background-image:url('+info.photo+');background-size:cover;background-position:center;':'')+'">'+(mode==='map'?planShape(info):'')+(d.planDrawing?'<div style="position:absolute;inset:0;pointer-events:none">'+(d.draftBoundary||[]).map(p=>'<span style="position:absolute;left:'+p[0]+'%;top:'+p[1]+'%;width:10px;height:10px;border-radius:50%;background:#dc864b;transform:translate(-50%,-50%)"></span>').join('')+'</div>':'')+items.map(x=>'<button type="button" data-item="'+x.id+'" onpointerdown="startPlanDrag(event,'+x.id+')" onclick="selectPlanItem('+x.id+')" aria-label="'+esc(x.name)+'" style="position:absolute;left:'+x.x+'%;top:'+x.y+'%;transform:translate(-50%,-50%) rotate('+(x.rotation||0)+'deg);width:'+planItemSize(x,info).w+';height:'+planItemSize(x,info).h+';font-size:25px;padding:3px;overflow:hidden;background:#fffdf2df;border:2px solid '+(selected&&selected.id===x.id?'#3e7057':'#ffffffaa')+';border-radius:14px;min-width:49px;min-height:49px;touch-action:none;box-shadow:0 2px 8px #0002">'+planVisual(x)+'</button>').join('')+'</div><p><small>Drag items to move them, or use the arrows below.</small></p><h3>Add to this corner</h3><div style="display:flex;flex-wrap:wrap;gap:5px">'+[['🪴','Pot'],['🌳','Tree'],['🌼','Flower bed'],['🥬','Veggie bed'],['🪑','Seat'],['🧱','Path'],['☂️','Shade'],['💧','Water']].map((x,i)=>'<button type="button" class="pill" data-add-plan="'+i+'">'+x[0]+' '+x[1]+'</button>').join('')+'</div>'+(selected?'<div class="card soft"><b>Selected: '+esc(selected.name)+'</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px"><span></span>'+b('↑','movePlan(0,-5)','alt')+'<span></span>'+b('←','movePlan(-5,0)','alt')+b('↓','movePlan(0,5)','alt')+b('→','movePlan(5,0)','alt')+'</div><h3>📏 Size</h3><div style="display:flex;gap:8px">'+b('− Smaller',"resizePlan(-12)",'alt')+b('+ Bigger',"resizePlan(12)",'alt')+'</div><h3>📐 Object dimensions (metres)</h3><label>Width<input type="number" min="0.1" max="30" step="0.1" value="'+(selected.mw||'')+'" placeholder="Set measured width" data-item-dim="mw"></label><label>Length<input type="number" min="0.1" max="30" step="0.1" value="'+(selected.mh||'')+'" placeholder="Set measured length" data-item-dim="mh"></label><h3>🔄 Rotate</h3><div style="display:flex;gap:8px">'+b('↶ Left',"rotatePlan(-45)",'alt')+b('↷ Right',"rotatePlan(45)",'alt')+'</div><small>Size and rotation are saved for this item.</small>'+b('Remove selected item','removePlan()','line')+'</div>':'')+'<p><small>Saved in this browser only. Measured objects use your entered dimensions; unmeasured items remain approximate. Outlines are sketches, not surveys.</small></p></div>'}
function planMode(mode){d.planMode=mode;save();render()}
function addPlanItem(index){let entry=[['🪴','Pot'],['🌳','Tree'],['🌼','Flower bed'],['🥬','Veggie bed'],['🪑','Seat'],['🧱','Path'],['☂️','Shade'],['💧','Water']][index];if(!entry)return;let [icon,name]=entry;let items=[...(zoneData(d.activeZone).layout||[])],id=Date.now()+Math.floor(Math.random()*1000);items.push({id,icon,name,x:50,y:50});d.selectedPlanItem=id;zoneField('layout',items);render();let board=document.getElementById('planBoard');if(board)board.scrollIntoView({block:'center',behavior:'smooth'})}
function selectPlanItem(id){if(d.selectedPlanItem===id)return;d.selectedPlanItem=id;save();render()}
function movePlan(dx,dy){let items=(zoneData(d.activeZone).layout||[]).map(x=>x.id===d.selectedPlanItem?{...x,x:Math.max(7,Math.min(93,x.x+dx)),y:Math.max(7,Math.min(93,x.y+dy))}:x);zoneField('layout',items);render()}
function resizePlan(delta){let items=(zoneData(d.activeZone).layout||[]).map(x=>x.id===d.selectedPlanItem?{...x,width:Math.max(42,Math.min(210,(x.width||54)+delta)),height:Math.max(42,Math.min(210,(x.height||54)+delta))}:x);zoneField('layout',items);render()}
function rotatePlan(delta){let items=(zoneData(d.activeZone).layout||[]).map(x=>x.id===d.selectedPlanItem?{...x,rotation:((x.rotation||0)+delta+360)%360}:x);zoneField('layout',items);render()}
function removePlan(){let items=(zoneData(d.activeZone).layout||[]).filter(x=>x.id!==d.selectedPlanItem);d.selectedPlanItem=null;zoneField('layout',items);render()}
document.addEventListener('click',function(event){let button=event.target.closest&&event.target.closest('[data-add-plan]');if(!button)return;event.preventDefault();try{addPlanItem(Number(button.getAttribute('data-add-plan')))}catch(error){alert('Could not add this item: '+error.message)}});
let draggingPlan=null;
function startPlanDrag(ev,id){if(ev.button!==undefined&&ev.button!==0)return;let board=document.getElementById('planBoard');if(!board)return;draggingPlan={id,board,moved:false};ev.currentTarget.setPointerCapture(ev.pointerId);d.selectedPlanItem=id;save()}
document.addEventListener('pointermove',ev=>{if(!draggingPlan)return;let board=draggingPlan.board,rect=board.getBoundingClientRect();let x=Math.max(7,Math.min(93,(ev.clientX-rect.left)/rect.width*100)),y=Math.max(7,Math.min(93,(ev.clientY-rect.top)/rect.height*100));let el=board.querySelector('[data-item="'+draggingPlan.id+'"]');if(el){el.style.left=x+'%';el.style.top=y+'%'}draggingPlan.x=x;draggingPlan.y=y;draggingPlan.moved=true});
document.addEventListener('pointerup',()=>{if(!draggingPlan)return;let p=draggingPlan;draggingPlan=null;if(p.moved){let items=(zoneData(d.activeZone).layout||[]).map(x=>x.id===p.id?{...x,x:p.x,y:p.y}:x);zoneField('layout',items)}render()});
function zoneData(z){d.zoneDetails=d.zoneDetails||{};return d.zoneDetails[z]||{}}function zoneOptions(opts,v){return opts.map(x=>'<option '+(x===(v||opts[0])?'selected':'')+'>'+esc(x)+'</option>').join('')}function openZone(i){d.activeZone=d.zones[i];go('zoneDetail')}function zoneField(k,v){let z=d.activeZone;d.zoneDetails=d.zoneDetails||{};d.zoneDetails[z]={...zoneData(z),[k]:v};save();if(k==='photo')render()}function addZone(){let x=document.getElementById('zone').value.trim();if(x&&!d.zones.includes(x)){d.zones.push(x);save();openZone(d.zones.length-1)}}function deleteZone(){let z=d.activeZone;if(!confirm('Remove this zone and its notes/photo?'))return;d.zones=d.zones.filter(x=>x!==z);if(d.zoneDetails)delete d.zoneDetails[z];go('zones')}function zonePhoto(ev){let f=ev.target.files&&ev.target.files[0];if(!f)return;if(f.size>12000000){alert('Choose a smaller photo.');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,850/img.width,850/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{zoneField('photo',c.toDataURL('image/jpeg',0.6))}catch(e){alert('Browser storage is full. Try a smaller photo.')}};img.src=reader.result};reader.readAsDataURL(f)}function check(n){d.checks[n]=(d.checks[n]||0)+1;save();render()}function another(){d.adventure++;save();render()}function finish(){let t=current();if(t&&!d.done.includes(t[0]))d.done.push(t[0]);d.adventure=0;go('celebrate')}function render(){document.getElementById('app').innerHTML=screen()}render();</script></main></body></html>
