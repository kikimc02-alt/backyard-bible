<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backyard Bible 🌿</title><style>:root{font-family:system-ui,sans-serif;background:#e8eee6;color:#2d493a}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;background:#f8f6ef;min-height:100vh;padding:25px 23px 85px}h1{font-size:34px;line-height:1.15}h2{font-size:21px}p{line-height:1.55;color:#657b6d}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:#3e7057}.card{background:white;border:1px solid #e4e9e1;border-radius:18px;padding:19px;margin:14px 0}.soft{background:#e9efe4}.hero{height:150px;display:grid;place-items:center;background:linear-gradient(130deg,#e3eddf,#c6d8bf);border-radius:22px;font-size:65px}.btn{display:block;width:100%;border:0;background:#3e7057;color:white;padding:15px;border-radius:14px;margin:12px 0;font-weight:700;font-size:15px}.alt{background:#e2ebde;color:#3e7057}.line{background:white;color:#3e7057;border:1px solid #b6cab8}.item{display:flex;gap:12px;align-items:center}.item b{flex:1}.item span{font-size:30px}small{color:#718075}input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid #cbd8c9;border-radius:12px;font:inherit}textarea{min-height:90px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:white;border-top:1px solid #dce7d9}.nav button{flex:1;background:none;border:0;padding:12px 2px;color:#3e7057;font-size:12px}.pill{display:inline-block;border:1px solid #b9cdb8;border-radius:20px;padding:9px;margin:4px;background:#fff;color:#3e7057}.selected{background:#3e7057;color:white}.progress{height:10px;border-radius:9px;background:#d4dfd0;overflow:hidden}.progress i{display:block;height:100%;background:#3e7057}</style></head><body><main id="app"></main><script>
const K='backyard-bible-web-v1';const initial={page:'welcome',space:'Backyard',goals:[],location:'',pace:10,budget:'Free',tenure:'Own',pets:false,kids:false,done:[],garden:[],saved:[],zones:['Sunny corner','Patio & pots'],notes:{},checks:{},shopping:[],adventure:0};let d;try{d={...initial,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{d={...initial}}
const plants=[['Basil','Herb','☀️'],['Rosemary','Herb','🌿'],['Thyme','Herb','🌿'],['Mint','Herb','🍃'],['Parsley','Herb','🌿'],['Chives','Herb','🌿'],['Oregano','Herb','🌿'],['Sage','Herb','🌿'],['Coriander','Herb','🌿'],['Lemon balm','Herb','🍃'],['Cherry tomato','Edible','🍅'],['Strawberry','Edible','🍓'],['Lettuce','Edible','🥬'],['Silverbeet','Edible','🥬'],['Radish','Edible','🥕'],['Rocket','Edible','🥬'],['Chilli','Edible','🌶️'],['Spring onion','Edible','🌱'],['Nasturtium','Flower','🌼'],['Calendula','Flower','🌼'],['Marigold','Flower','🌼'],['Zinnia','Flower','🌸'],['Viola','Flower','🌸'],['Lavender','Flower','💜'],['Sunflower','Flower','🌻'],['Kangaroo paw','Native','🌾'],['Westringia','Native','🌿'],['Grevillea','Native','🌺'],['Bottlebrush','Native','🌺'],['Native violet','Native','🌸']];
const tasks=[['Find your sunniest spot','☀️',10,'Free','Notice where the sunlight falls during the day.','Observe the morning light|Check again later|Note the brightest corner'],['Take a before photo','📸',10,'Free','Capture the start of your sanctuary.','Choose one corner|Take a photo|Keep it for later'],['Choose one little zone','🗺️',10,'Free','Start with a small, manageable area.','Walk outside|Pick one area|Give it a name'],['A five-minute tidy','🧹',10,'Free','Refresh a tiny corner.','Pick up five stray items|Put them away|Enjoy the difference'],['Find your shady corner','🌤️',10,'Free','Notice where shade settles.','Walk around|Find a cool spot|Make a note'],['Listen to your garden','🐦',10,'Free','Enjoy a quiet outdoor moment.','Step outside|Listen|Notice what feels peaceful'],['Pick a colour palette','🎨',10,'Free','Choose two colours that make you smile.','Find inspiration|Pick two colours|Save your idea'],['Find your water source','💧',10,'Free','Plan how you might water plants.','Locate a tap|Check the distance|Make a note'],['Plan a herb pot','🌿',30,'Low','Imagine a small herb garden.','Choose a sunny spot|Check local seasons|Find a draining pot'],['Arrange movable pots','🪴',30,'Low','Try a new layout.','Gather existing pots|Arrange them|Keep paths clear'],['Make an inspiration board','🌼',30,'Free','Collect three ideas you love.','Find three pictures|Spot a theme|Choose one detail'],['Sort garden supplies','🧺',30,'Free','See what you already own.','Gather supplies|Sort them|Write down what is missing'],['Create a cosy pause spot','🪑',30,'Free','Make a place to sit.','Find a chair|Try a sheltered spot|Enjoy five minutes'],['Plan a pollinator corner','🦋',30,'Free','Explore local flowering plants.','Research native plants|Check suitability|Check pet safety'],['Check pot drainage','🪴',10,'Free','Help a plant avoid soggy roots.','Inspect the pot|Check drainage holes|Decide what it needs'],['Notice windy spots','🍃',10,'Free','Get to know your outdoor breeze.','Watch leaves move|Find exposed areas|Find shelter']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(d))}function go(p){d.page=p;save();render();scrollTo(0,0)}function set(k,v){d[k]=v;save();render()}function toggle(k,v){d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):[...d[k],v];save();render()}function b(t,call,cl=''){return '<button class="btn '+cl+'" onclick="'+call+'">'+t+'</button>'}function head(){return '<div class="brand">✳ BACKYARD BIBLE</div>'}function nav(){return '<div class="nav"><button onclick="go(\'home\')">☀️<br>Today</button><button onclick="go(\'sanctuary\')">🌱<br>Sanctuary</button><button onclick="go(\'zones\')">▦<br>My Space</button><button onclick="go(\'ideas\')">♡<br>Ideas</button></div>'}function choices(k,opts){return opts.map(x=>b((d[k]===x?'✓ ':'')+x,"set('"+k+"','"+x+"')",d[k]===x?'':'alt')).join('')}function current(){let a=tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')&&!d.done.includes(t[0]));return a[d.adventure%Math.max(1,a.length)]}
function screen(){let p=d.page,s=head();if(p==='welcome')return s+'<h1>Your sanctuary starts today. 🌿</h1><p>Beautiful outdoor spaces, without the overwhelm.</p><div class="hero">🌱☀️🪴</div><h2>One little adventure at a time.</h2><p>No pressure, no perfection. Just progress.</p>'+b('Create My Sanctuary',"go('setup')");if(p==='setup')return s+'<h1>Let’s make this yours 🌼</h1><p>Choose what feels right. You can change your mind later.</p><h2>Your space</h2>'+choices('space',['Backyard','Courtyard','Balcony','Acreage'])+'<h2>Your pace</h2>'+[10,30,60].map(n=>b((d.pace===n?'✓ ':'')+n+' minutes',"set('pace',"+n+")",d.pace===n?'':'alt')).join('')+'<h2>Budget</h2>'+choices('budget',['Free','Low'])+'<h2>Rent or own?</h2>'+choices('tenure',['Rent','Own'])+'<h2>Suburb or postcode</h2><input placeholder="e.g. Perth, WA" value="'+esc(d.location)+'" oninput="d.location=this.value;save()"><h2>What are you dreaming of?</h2>'+['Peaceful retreat','Grow something good','Make it beautiful','Gather and connect','A fresh start'].map(x=>b((d.goals.includes(x)?'✓ ':'')+x,"toggle('goals','"+x+"')",d.goals.includes(x)?'':'alt')).join('')+'<h2>Sharing with pets or kids?</h2>'+b(d.pets?'✓ Pets':'Pets',"set('pets',"+!d.pets+")",'alt')+b(d.kids?'✓ Children':'Children',"set('kids',"+!d.kids+")",'alt')+b('Find My First Adventure',"go('home')");
if(p==='home'){let t=current();return s+'<h1>A little adventure for today ☀️</h1><p>One step is plenty. Your sanctuary can wait whenever you need a break.</p><div class="card soft"><b>YOUR JOURNEY</b><h2>🌱 '+(d.done.length<3?'Sprouting':d.done.length<10?'Growing':'Blooming')+'</h2><div class="progress"><i style="width:'+Math.min(100,d.done.length*5)+'%"></i></div><small>'+d.done.length+' adventures completed</small></div><div class="card"><small>TODAY’S ADVENTURE</small><div class="hero">'+(t?t[1]:'🌼')+'</div><h2>'+(t?esc(t[0]):'Your sanctuary is blooming!')+'</h2><p>'+(t?esc(t[4]):'You have completed all your current adventures.')+'</p>'+(t?'<small>'+t[2]+' min · '+t[3]+'</small>'+b('Explore this adventure',"go('adventure')"):'')+'</div>'+b('↻ Another adventure','another()','alt')+b('🌱 My Garden',"go('garden')",'alt')+b('Browse adventures',"go('tasks')",'line')+nav()}
if(p==='adventure'){let t=current();return s+'<div class="hero">'+(t?t[1]:'🌼')+'</div><h1>'+(t?esc(t[0]):'All done!')+'</h1><p>'+(t?esc(t[4]):'Enjoy your sanctuary.')+'</p><h2>Your little steps</h2>'+(t?t[5].split('|').map((x,i)=>'<div class="card">'+(i+1)+'. '+esc(x)+'</div>').join(''):'')+b('I did it! 🌼','finish()')+b('Back',"go('home')",'alt')}
if(p==='celebrate')return s+'<div class="hero">🎉🌼</div><h1>Look at you, growing!</h1><p>One more little step for your sanctuary.</p><h2>'+d.done.length+' adventures completed</h2>'+b('Back to My Sanctuary',"go('home')");
if(p==='tasks')return s+'<h1>Little Adventures ☀️</h1><p>Small ideas to help your sanctuary grow.</p>'+tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')).map(t=>'<div class="card item"><span>'+t[1]+'</span><b>'+esc(t[0])+'<br><small>'+t[2]+' min · '+(d.done.includes(t[0])?'✓ Complete':t[3])+'</small></b></div>').join('')+nav();
if(p==='sanctuary')return s+'<h1>Your sanctuary is blooming 🌼</h1><div class="card soft"><h2>'+d.done.length+' little victories</h2><p>There is no falling behind here.</p></div>'+b('Visit My Garden',"go('garden')")+b('Explore Plants',"go('plants')",'alt')+nav();
if(p==='zones')return s+'<h1>My Outdoor Space 🏡</h1><p>'+esc(d.space)+' · '+esc(d.location||'Location not set')+'</p><h2>My little zones</h2>'+d.zones.map(z=>'<div class="card">🌿 '+esc(z)+'</div>').join('')+'<input id="zone" maxlength="50" placeholder="Name a new zone">'+b('Add Zone','addZone()')+nav();
if(p==='ideas')return s+'<h1>Ideas for your sanctuary ♡</h1><p>Explore without making a giant to-do list.</p><div class="card"><h2>🌿 Plant Library</h2><p>Explore 30 starter plants, from herbs to native flowers.</p>'+b('Explore Plants',"go('plants')")+'</div>'+b('🌱 My Garden',"go('garden')",'alt')+b('♡ Saved Plants',"go('saved')",'alt')+b('🧺 Shopping List',"go('shopping')",'alt')+nav();
if(p==='plants'||p==='saved'){let list=p==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;return s+'<h1>'+(p==='saved'?'Saved Plants ♡':'Plant Library 🌿')+'</h1><p>Growing ideas, not a planting prescription. Check local season and pet safety before buying.</p><input placeholder="Search plants..." oninput="filter(this.value)"><div id="plantlist">'+list.map(plantRow).join('')+'</div>'+nav()}
if(p.startsWith('plant:')){let x=plants.find(z=>z[0]===p.slice(6));if(!x)return '';return s+'<div class="hero">'+x[2]+'</div><h1>'+esc(x[0])+'</h1><p>'+x[1]+' · Explore whether this plant suits your light, soil, climate and available space.</p><div class="card"><b>🌤️ Local suitability</b><p>Check a local gardening guide for planting season and watering needs.</p><b>🐾 Pet safety</b><p>Not verified for this exact species or cultivar. Check veterinary toxicity guidance before placing within pets’ reach.</p></div>'+b(d.garden.includes(x[0])?'✓ In My Garden':"🌱 I'm Growing This","toggle('garden','"+x[0]+"')")+b(d.saved.includes(x[0])?'♥ Saved':'♡ Save for Later',"toggle('saved','"+x[0]+"')",'alt')+b('Back to Library',"go('plants')",'line')+nav()}
if(p==='garden')return s+'<h1>My Garden 🌱</h1><p>Your growing plants, at your pace. No overdue tasks.</p><div class="card soft"><h2>'+d.garden.length+' plants growing</h2></div>'+(d.garden.length?d.garden.map(n=>'<div class="card item"><span>🌿</span><b>'+esc(n)+'<br><small>'+((d.checks[n]||0))+' gentle check-ins</small></b><button class="pill" onclick="go(\'gplant:'+encodeURIComponent(n)+'\')">Visit</button></div>').join(''):'<div class="card">Your first green friend is waiting in the Plant Library. 🌿</div>')+b('Browse Plants',"go('plants')")+nav();
if(p.startsWith('gplant:')){let n=decodeURIComponent(p.slice(7));return s+'<div class="hero">🌿</div><h1>'+esc(n)+'</h1><p>Take a moment to notice new leaves, the soil and the light.</p><div class="card"><h2>A gentle check-in</h2><p>No reminders, no guilt. Check when it feels right.</p>'+b('I checked my plant',"check('"+n+"')")+'<small>'+(d.checks[n]||0)+' check-ins so far</small></div><h2>Little observations</h2><textarea oninput="d.notes['+JSON.stringify(n)+']=this.value;save()" placeholder="New leaves, first flower, things to try...">'+esc(d.notes[n]||'')+'</textarea>'+b('Back to My Garden',"go('garden')",'alt')+nav()}
if(p==='shopping')return s+'<h1>Your Little List 🧺</h1><p>Start with what you already have.</p>'+['Gardening gloves','Pot with drainage','Potting mix','Watering can','A plant you love'].map(x=>'<div class="card"><label><input type="checkbox" style="width:20px" '+(d.shopping.includes(x)?'checked':'')+' onchange="toggle(\'shopping\',\''+x+'\')"> '+x+'</label></div>').join('')+nav();return s+b('Go Home',"go('home')")}
function plantRow(x){return '<div class="card item"><span>'+x[2]+'</span><b>'+esc(x[0])+'<br><small>'+x[1]+'</small></b><button class="pill" onclick="go(\'plant:'+esc(x[0])+'\')">View</button></div>'}function filter(q){let p=d.page==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;document.getElementById('plantlist').innerHTML=p.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(plantRow).join('')}function addZone(){let x=document.getElementById('zone').value.trim();if(x&&!d.zones.includes(x)){d.zones.push(x);save();render()}}function check(n){d.checks[n]=(d.checks[n]||0)+1;save();render()}function another(){d.adventure++;save();render()}function finish(){let t=current();if(t&&!d.done.includes(t[0]))d.done.push(t[0]);d.adventure=0;go('celebrate')}function render(){document.getElementById('app').innerHTML=screen()}render();</script></main></body></html>
