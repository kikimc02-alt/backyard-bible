<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backyard Bible 🌿</title><style>:root{font-family:system-ui,sans-serif;background:#e8eee6;color:#2d493a}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;background:#f8f6ef;min-height:100vh;padding:25px 23px 85px}h1{font-size:34px;line-height:1.15}h2{font-size:21px}p{line-height:1.55;color:#657b6d}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:#3e7057}.card{background:white;border:1px solid #e4e9e1;border-radius:18px;padding:19px;margin:14px 0}.soft{background:#e9efe4}.hero{height:150px;display:grid;place-items:center;background:linear-gradient(130deg,#e3eddf,#c6d8bf);border-radius:22px;font-size:65px}.btn{display:block;width:100%;border:0;background:#3e7057;color:white;padding:15px;border-radius:14px;margin:12px 0;font-weight:700;font-size:15px}.alt{background:#e2ebde;color:#3e7057}.line{background:white;color:#3e7057;border:1px solid #b6cab8}.item{display:flex;gap:12px;align-items:center}.item b{flex:1}.item span{font-size:30px}small{color:#718075}input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid #cbd8c9;border-radius:12px;font:inherit}textarea{min-height:90px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:white;border-top:1px solid #dce7d9}.nav button{flex:1;background:none;border:0;padding:12px 2px;color:#3e7057;font-size:12px}.pill{display:inline-block;border:1px solid #b9cdb8;border-radius:20px;padding:9px;margin:4px;background:#fff;color:#3e7057}.selected{background:#3e7057;color:white}.progress{height:10px;border-radius:9px;background:#d4dfd0;overflow:hidden}.progress i{display:block;height:100%;background:#3e7057}</style><script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script></head><body><main id="app"></main><script>

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(d))}function go(p){d.page=p;save();render();scrollTo(0,0)}function set(k,v){d[k]=v;save();render()}function toggle(k,v){d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):[...d[k],v];save();render()}function b(t,call,cl=''){return '<button class="btn '+cl+'" onclick="'+call+'">'+t+'</button>'}function head(){return '<div class="brand">✳ BACKYARD BIBLE</div>'}function nav(){return '<div class="nav"><button onclick="go(\'home\')">☀️<br>Today</button><button onclick="go(\'sanctuary\')">🌱<br>Sanctuary</button><button onclick="go(\'zones\')">▦<br>My Space</button><button onclick="go(\'ideas\')">♡<br>Ideas</button></div>'}function choices(k,opts){return opts.map(x=>b((d[k]===x?'✓ ':'')+x,"set('"+k+"','"+x+"')",d[k]===x?'':'alt')).join('')}function current(){let a=tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')&&!d.done.includes(t[0]));return a[d.adventure%Math.max(1,a.length)]}
function screen(){let p=d.page,s=head();if(p==='welcome')return s+'<h1>Your sanctuary starts today. 🌿</h1><p>Beautiful outdoor spaces, without the overwhelm.</p><div class="hero">🌱☀️🪴</div><h2>One little adventure at a time.</h2><p>No pressure, no perfection. Just progress.</p>'+b('Create My Sanctuary',"go('setup')");if(p==='setup')return s+'<h1>Let’s make this yours 🌼</h1><p>Choose what feels right. You can change your mind later.</p><h2>Your space</h2>'+choices('space',['Backyard','Courtyard','Balcony','Acreage'])+'<h2>Your pace</h2>'+[10,30,60].map(n=>b((d.pace===n?'✓ ':'')+n+' minutes',"set('pace',"+n+")",d.pace===n?'':'alt')).join('')+'<h2>Budget</h2>'+choices('budget',['Free','Low'])+'<h2>Rent or own?</h2>'+choices('tenure',['Rent','Own'])+'<h2>Suburb or postcode</h2><input placeholder="e.g. Perth, WA" value="'+esc(d.location)+'" oninput="d.location=this.value;save()"><h2>What are you dreaming of?</h2>'+['Peaceful retreat','Grow something good','Make it beautiful','Gather and connect','A fresh start'].map(x=>b((d.goals.includes(x)?'✓ ':'')+x,"toggle('goals','"+x+"')",d.goals.includes(x)?'':'alt')).join('')+'<h2>Sharing with pets or kids?</h2>'+b(d.pets?'✓ Pets':'Pets',"set('pets',"+!d.pets+")",'alt')+b(d.kids?'✓ Children':'Children',"set('kids',"+!d.kids+")",'alt')+b('Find My First Adventure',"go('home')");
if(p==='home'){let t=current();return s+'<h1>A little adventure for today ☀️</h1><p>One step is plenty. Your sanctuary can wait whenever you need a break.</p><div class="card soft"><b>YOUR JOURNEY</b><h2>🌱 '+(d.done.length<3?'Sprouting':d.done.length<10?'Growing':'Blooming')+'</h2><div class="progress"><i style="width:'+Math.min(100,d.done.length*5)+'%"></i></div><small>'+d.done.length+' adventures completed</small></div><div class="card"><small>TODAY’S ADVENTURE</small><div class="hero">'+(t?t[1]:'🌼')+'</div><h2>'+(t?esc(t[0]):'Your sanctuary is blooming!')+'</h2><p>'+(t?esc(t[4]):'You have completed all your current adventures.')+'</p>'+(t?'<small>'+t[2]+' min · '+t[3]+'</small>'+b('Explore this adventure',"go('adventure')"):'')+'</div>'+b('↻ Another adventure','another()','alt')+b('🌱 My Garden',"go('garden')",'alt')+b('Browse adventures',"go('tasks')",'line')+nav()}
if(p==='adventure'){let t=current();return s+'<div class="hero">'+(t?t[1]:'🌼')+'</div><h1>'+(t?esc(t[0]):'All done!')+'</h1><p>'+(t?esc(t[4]):'Enjoy your sanctuary.')+'</p><h2>Your little steps</h2>'+(t?t[5].split('|').map((x,i)=>'<div class="card">'+(i+1)+'. '+esc(x)+'</div>').join(''):'')+b('I did it! 🌼','finish()')+b('Back',"go('home')",'alt')}
if(p==='celebrate')return s+'<div class="hero">🎉🌼</div><h1>Look at you, growing!</h1><p>One more little step for your sanctuary.</p><h2>'+d.done.length+' adventures completed</h2>'+b('Back to My Sanctuary',"go('home')");
if(p==='tasks')return s+'<h1>Little Adventures ☀️</h1><p>Small ideas to help your sanctuary grow.</p>'+tasks.filter(t=>t[2]<=d.pace&&(d.budget!=='Free'||t[3]==='Free')).map(t=>'<div class="card item"><span>'+t[1]+'</span><b>'+esc(t[0])+'<br><small>'+t[2]+' min · '+(d.done.includes(t[0])?'✓ Complete':t[3])+'</small></b></div>').join('')+nav();
if(p==='sanctuary')return s+'<h1>Your sanctuary is blooming 🌼</h1><div class="card soft"><h2>'+d.done.length+' little victories</h2><p>There is no falling behind here.</p></div>'+b('Visit My Garden',"go('garden')")+b('Explore Plants',"go('plants')",'alt')+nav();
if(p==='zones')return s+'<h1>My Outdoor Space 🏡</h1><p>'+esc(d.space)+' · '+esc(d.location||'Location not set')+'</p><div class="card soft"><h2>'+d.zones.length+' little zones 🌿</h2><p>Give each corner its own personality. No rush.</p></div>'+d.zones.map((z,i)=>{let info=zoneData(z);return '<div class="card"><div class="item"><span>🌿</span><b>'+esc(z)+'<br><small>'+esc(info.sun||'Sunlight unknown')+' · '+esc(info.stage||'Just dreaming')+'</small></b></div>'+(info.photo?'<img src="'+info.photo+'" alt="Zone photo" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-top:12px">':'')+'<p>'+esc(info.vision||'A little corner full of possibility.')+'</p>'+b('Explore this zone',"openZone("+i+")",'alt')+'</div>'}).join('')+'<div class="card"><h2>✨ Add a zone</h2><input id="zone" maxlength="50" placeholder="e.g. Shady patio">'+b('Add Zone','addZone()')+'</div>'+nav();
if(p==='zoneDetail'){let z=d.activeZone,info=zoneData(z);if(!d.zones.includes(z))return s+b('Back',"go('zones')");return s+b('‹ My Space',"go('zones')",'line')+'<h1>'+esc(z)+' 🌿</h1><p>Plan this corner at your own pace.</p><div class="card"><h2>📸 Your corner</h2>'+(info.photo?'<img alt="Zone photo" src="'+info.photo+'" style="width:100%;max-height:230px;object-fit:cover;border-radius:12px">':'<div class="hero">📷</div>')+'<input type="file" accept="image/*" onchange="zonePhoto(event)"><small>Photo is saved only in this browser. Clearing browser data may erase it.</small>'+(info.photo?b('Remove photo',"zoneField('photo','')",'line'):'')+'</div><div class="card"><h2>🌤️ About this spot</h2><label>Sunlight<select onchange="zoneField(this.name,this.value)" name="sun">'+zoneOptions(['Not sure yet','Full sun','Part sun','Mostly shade'],info.sun)+'</select></label><label>Purpose<select onchange="zoneField(this.name,this.value)" name="purpose">'+zoneOptions(['Not sure yet','Relaxing','Growing food','Flowers & beauty','Gathering','Practical space'],info.purpose)+'</select></label><label>Progress<select onchange="zoneField(this.name,this.value)" name="stage">'+zoneOptions(['Just dreaming','Planning','Getting started','Growing nicely','Feeling finished'],info.stage)+'</select></label></div><div class="card"><h2>💭 Your vision</h2><textarea name="vision" oninput="zoneField(this.name,this.value)" placeholder="What could this corner become?">'+esc(info.vision||'')+'</textarea><h2>📝 Notes</h2><textarea name="notes" oninput="zoneField(this.name,this.value)" placeholder="Wind, soil, measurements, ideas...">'+esc(info.notes||'')+'</textarea><small>Changes save on this device.</small></div>'+plannerSection(info)+b('Remove this zone','deleteZone()','line')+nav()}
if(p==='ideas')return s+'<h1>Ideas for your sanctuary ♡</h1><p>Explore without making a giant to-do list.</p><div class="card"><h2>🌿 Plant Library</h2><p>Explore 30 starter plants, from herbs to native flowers.</p>'+b('Explore Plants',"go('plants')")+'</div>'+b('🌱 My Garden',"go('garden')",'alt')+b('♡ Saved Plants',"go('saved')",'alt')+b('🧺 Shopping List',"go('shopping')",'alt')+nav();
if(p==='plants'||p==='saved'){let list=p==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;return s+'<h1>'+(p==='saved'?'Saved Plants ♡':'Plant Library 🌿')+'</h1><p>Growing ideas, not a planting prescription. Check local season and pet safety before buying.</p><input placeholder="Search plants..." oninput="filter(this.value)"><div id="plantlist">'+list.map(plantRow).join('')+'</div>'+nav()}
if(p.startsWith('plant:')){let x=plants.find(z=>z[0]===p.slice(6));if(!x)return '';return s+'<div class="hero">'+x[2]+'</div><h1>'+esc(x[0])+'</h1><p>'+x[1]+' · Explore whether this plant suits your light, soil, climate and available space.</p><div class="card"><b>🌤️ Local suitability</b><p>Check a local gardening guide for planting season and watering needs.</p><b>🐾 Pet safety</b><p>Not verified for this exact species or cultivar. Check veterinary toxicity guidance before placing within pets’ reach.</p></div>'+b(d.garden.includes(x[0])?'✓ In My Garden':"🌱 I'm Growing This","toggle('garden','"+x[0]+"')")+b(d.saved.includes(x[0])?'♥ Saved':'♡ Save for Later',"toggle('saved','"+x[0]+"')",'alt')+b('Back to Library',"go('plants')",'line')+nav()}
if(p==='garden')return s+'<h1>My Garden 🌱</h1><p>Your growing plants, at your pace. No overdue tasks.</p><div class="card soft"><h2>'+d.garden.length+' plants growing</h2></div>'+(d.garden.length?d.garden.map(n=>'<div class="card item"><span>🌿</span><b>'+esc(n)+'<br><small>'+((d.checks[n]||0))+' gentle check-ins</small></b><button class="pill" onclick="go(\'gplant:'+encodeURIComponent(n)+'\')">Visit</button></div>').join(''):'<div class="card">Your first green friend is waiting in the Plant Library. 🌿</div>')+b('Browse Plants',"go('plants')")+nav();
if(p.startsWith('gplant:')){let n=decodeURIComponent(p.slice(7));return s+'<div class="hero">🌿</div><h1>'+esc(n)+'</h1><p>Take a moment to notice new leaves, the soil and the light.</p><div class="card"><h2>A gentle check-in</h2><p>No reminders, no guilt. Check when it feels right.</p>'+b('I checked my plant',"check('"+n+"')")+'<small>'+(d.checks[n]||0)+' check-ins so far</small></div><h2>Little observations</h2><textarea oninput="d.notes['+JSON.stringify(n)+']=this.value;save()" placeholder="New leaves, first flower, things to try...">'+esc(d.notes[n]||'')+'</textarea>'+b('Back to My Garden',"go('garden')",'alt')+nav()}
if(p==='shopping')return s+'<h1>Your Little List 🧺</h1><p>Start with what you already have.</p>'+['Gardening gloves','Pot with drainage','Potting mix','Watering can','A plant you love'].map(x=>'<div class="card"><label><input type="checkbox" style="width:20px" '+(d.shopping.includes(x)?'checked':'')+' onchange="toggle(\'shopping\',\''+x+'\')"> '+x+'</label></div>').join('')+nav();return s+b('Go Home',"go('home')")}
function plantRow(x){return '<div class="card item"><span>'+x[2]+'</span><b>'+esc(x[0])+'<br><small>'+x[1]+'</small></b><button class="pill" onclick="go(\'plant:'+esc(x[0])+'\')">View</button></div>'}function filter(q){let p=d.page==='saved'?plants.filter(x=>d.saved.includes(x[0])):plants;document.getElementById('plantlist').innerHTML=p.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(plantRow).join('')}

function planShape(info){let points=info.boundary||[[4,4],[96,4],[96,96],[4,96]];return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><polygon points="'+points.map(p=>p.join(',')).join(' ')+'" fill="#b6d3a966" stroke="#3e7057" stroke-width="0.8" stroke-dasharray="2 1"/></svg>'}
function planDims(info){return {w:Math.max(1,Number(info.planWidth)||5),h:Math.max(1,Number(info.planLength)||5)}}
function planItemSize(x,info){let dims=planDims(info);if(Number.isInteger(x.plantIndex)&&PLAN_PLANTS[x.plantIndex]){let p=PLAN_PLANTS[x.plantIndex],diameter=d.plantView==='mature'?p.m:p.now;return {w:Math.max(2,diameter/dims.w*100)+'%',h:Math.max(2,diameter/dims.h*100)+'%'}}return {w:x.mw?Math.max(5,x.mw/dims.w*100)+'%':(x.width||54)+'px',h:x.mh?Math.max(5,x.mh/dims.h*100)+'%':(x.height||54)+'px'}}
function planSetup(info){let dims=planDims(info);return '<div class="card soft"><h3>📐 Your space</h3><p>Start with a simple rectangle, or sketch your own outline. Measurements are optional until you know them.</p><label>Width (metres)<input type="number" min="1" max="100" step="0.1" value="'+dims.w+'" data-plan-dim="planWidth"></label><label>Length (metres)<input type="number" min="1" max="100" step="0.1" value="'+dims.h+'" data-plan-dim="planLength"></label><small>Default: 5 × 5 m. Dimensions control the scale of measured objects.</small><div style="display:flex;gap:8px">'+b('▭ Rectangle',"setPlanDrawing(false)",'alt')+b('✏️ Draw outline',"setPlanDrawing(true)",'alt')+'</div>'+(d.planDrawing?'<p><b>Drawing mode:</b> Tap the grid to mark corners, then choose Finish. Add at least 3 corners.</p>'+b('✓ Finish outline','finishPlanOutline()')+b('Cancel drawing','cancelPlanOutline()','line'):'')+'</div>'}
function setPlanDrawing(on){d.planDrawing=on;d.draftBoundary=[];render()}
function cancelPlanOutline(){d.planDrawing=false;d.draftBoundary=[];render()}
function finishPlanOutline(){if((d.draftBoundary||[]).length<3){alert('Tap at least three corners on the grid first.');return}zoneField('boundary',d.draftBoundary);d.planDrawing=false;d.draftBoundary=[];render()}
function planBoardTap(ev){if(!d.planDrawing||ev.target.closest('[data-item]'))return;let rect=ev.currentTarget.getBoundingClientRect();let x=Math.max(0,Math.min(100,Math.round((ev.clientX-rect.left)/rect.width*100))),y=Math.max(0,Math.min(100,Math.round((ev.clientY-rect.top)/rect.height*100)));d.draftBoundary=d.draftBoundary||[];d.draftBoundary.push([x,y]);render()}
document.addEventListener('change',function(ev){let item=ev.target.closest&&ev.target.closest('[data-item-dim]');if(item){setPlanItemDimension(item.getAttribute('data-item-dim'),item.value);return}let el=ev.target.closest&&ev.target.closest('[data-plan-dim]');if(!el)return;let value=Number(el.value);if(!Number.isFinite(value)||value<1||value>100){alert('Enter a measurement between 1 and 100 metres.');return}zoneField(el.getAttribute('data-plan-dim'),value);render()});
function setPlanItemDimension(axis,value){let v=Number(value);if(!Number.isFinite(v)||v<0.1||v>30){alert('Enter a size between 0.1 and 30 metres.');return}let info=zoneData(d.activeZone),dims=planDims(info),items=(info.layout||[]).map(x=>{if(x.id!==d.selectedPlanItem)return x;return {...x,mw:axis==='mw'?v:(x.mw||((x.width||54)/320*dims.w)),mh:axis==='mh'?v:(x.mh||((x.height||54)/320*dims.h))}});zoneField('layout',items);render()}
const PLAN_GROUNDS={grass:{label:'🌱 Lawn',color:'#a6c889',pattern:'repeating-linear-gradient(115deg,#ffffff18 0 2px,transparent 2px 13px)'},soil:{label:'🟤 Soil',color:'#987554',pattern:'radial-gradient(#513b2c55 1px,transparent 2px)'},mulch:{label:'🍂 Mulch',color:'#b28a62',pattern:'repeating-linear-gradient(35deg,#71543d55 0 2px,transparent 3px 15px)'},paving:{label:'▦ Paving',color:'#c9c6b8',pattern:'linear-gradient(90deg,#88877777 1px,transparent 1px),linear-gradient(#88877777 1px,transparent 1px)'},gravel:{label:'◌ Gravel',color:'#c4bba3',pattern:'radial-gradient(#91867188 2px,transparent 3px)'}};
function planGroundStyle(key){let g=PLAN_GROUNDS[key]||PLAN_GROUNDS.grass;return 'background-color:'+g.color+';background-image:'+g.pattern+';background-size:22px 22px;'}

function planSurfaceControls(info){return '<div class="card soft"><h3>🌱 Stage 1: Ground surfaces</h3><p>Choose a base for the whole zone, or add a movable, measured surface patch.</p><div style="display:flex;gap:6px;flex-wrap:wrap">'+Object.keys(PLAN_GROUNDS).map(k=>'<button type="button" class="pill" data-ground="'+k+'" style="border:'+(info.ground===k?'3px solid #37634d':'1px solid #aeb6a8')+'">'+PLAN_GROUNDS[k].label+'</button>').join('')+'</div><p><small>Tap a surface above to change the zone base.</small></p><div style="display:flex;gap:6px;flex-wrap:wrap">'+Object.keys(PLAN_GROUNDS).map(k=>'<button type="button" class="pill" data-surface="'+k+'">+ '+PLAN_GROUNDS[k].label+' area</button>').join('')+'</div><small>Surface patches start at 2 × 2 m. Drag and resize them just like garden objects. Garden beds and plant spacing are coming in the next stages.</small></div>'}

(info.layout||[]).forEach((o,i)=>{let x=((o.x||50)/100-.5)*dims.w,z=((o.y||50)/100-.5)*dims.h;if(o.bedShape||String(o.name||'').startsWith('Surface: ')){let bed=!!o.bedShape,bw=Math.min(dims.w,Math.max(.2,o.mw||1.5)),bh=Math.min(dims.h,Math.max(.2,o.mh||1));let block=add(new T.BoxGeometry(bw,bed?.3:.045,bh),bed?0x81583e:0xb1a68d,x,bed?.15:.02,z);block.rotation.y=-(o.rotation||0)*Math.PI/180;if(bed){let top=add(new T.BoxGeometry(bw*.92,.03,bh*.9),0x5c422e,x,.31,z);top.rotation.y=block.rotation.y}return}if(Number.isInteger(o.plantIndex)&&PLAN_PLANTS[o.plantIndex]){let p=PLAN_PLANTS[o.plantIndex],dia=d.plantView==='mature'?p.m:p.now,r=Math.max(.06,dia*.45);plant(x,z,r,Math.max(.12,r*(o.plantIndex===7?2.8:1.7)),o.plantIndex);return}let n=(o.name||'').toLowerCase();if(n.includes('path'))add(new T.BoxGeometry(.6,.04,1.2),0xbeb7a5,x,.02,z);else if(n.includes('seat')){add(new T.BoxGeometry(.8,.08,.3),0x926f4e,x,.42,z);for(let k of [-.3,.3])add(new T.BoxGeometry(.06,.42,.06),0x75543c,x+k,.2,z)}else if(n.includes('pot')){add(new T.CylinderGeometry(.2,.15,.25,8),0xb87e59,x,.12,z);plant(x,z,.2,.5,2)}else plant(x,z,n.includes('tree')?.65:.2,n.includes('tree')?1.7:.4,i%5)});

function gardenPreview(info){let mode=d.previewPhoto&&info.photo?'photo':'map',items=[...(info.layout||[])].sort((a,b)=>planLayer(a)-planLayer(b)),dims=planDims(info),plants=items.filter(x=>Number.isInteger(x.plantIndex)&&PLAN_PLANTS[x.plantIndex]);return '<div class="card"><h2>🌿 Your garden preview</h2><p>Explore your design from above or at ground level.</p><div style="display:flex;gap:8px">'+b('🗺️ Bird’s-eye',"gardenPreviewView('overhead')",(d.previewView||'overhead')==='overhead'?'':'alt')+b('🏡 Ground-level',"gardenPreviewView('ground')",d.previewView==='ground'?'':'alt')+'</div>'+b('← Back to editor','toggleGardenPreview(false)','alt')+'<div style="display:flex;gap:8px">'+b('🌱 Current',"planPlantView('current')",(d.plantView||'current')==='current'?'':'alt')+b('🌳 Mature',"planPlantView('mature')",d.plantView==='mature'?'':'alt')+'</div>'+(info.photo?'<div style="display:flex;gap:8px">'+b('🗺️ Plan',"previewPhotoMode(false)",!d.previewPhoto?'':'alt')+b('📸 Photo',"previewPhotoMode(true)",d.previewPhoto?'':'alt')+'</div>':'')+garden3DScene(info)+'<p><small>'+dims.w+' m × '+dims.h+' m · '+items.length+' garden elements · '+plants.length+' plants · '+(d.plantView==='mature'?'Mature':'Current')+' planting view</small></p>'+planSpacingSummary(info)+b('✏️ Return to editing','toggleGardenPreview(false)','alt')+'<small>Both previews now use a real 3D model. Plants and materials are simplified, not photorealistic. Your saved layout is unchanged.</small></div>'}

function planMode(mode){d.planMode=mode;save();render()}
function addPlanItem(index){let entry=[['🪴','Pot'],['🌳','Tree'],['🌼','Flower bed'],['🥬','Veggie bed'],['🪑','Seat'],['🧱','Path'],['☂️','Shade'],['💧','Water']][index];if(!entry)return;let [icon,name]=entry;let items=[...(zoneData(d.activeZone).layout||[])],id=Date.now()+Math.floor(Math.random()*1000);items.push({id,icon,name,x:50,y:50});d.selectedPlanItem=id;zoneField('layout',items);render();let board=document.getElementById('planBoard');if(board)board.scrollIntoView({block:'center',behavior:'smooth'})}

document.addEventListener('click',function(event){let button=event.target.closest&&event.target.closest('[data-add-plan]');if(!button)return;event.preventDefault();try{addPlanItem(Number(button.getAttribute('data-add-plan')))}catch(error){alert('Could not add this item: '+error.message)}});

function zoneData(z){d.zoneDetails=d.zoneDetails||{};return d.zoneDetails[z]||{}}function zoneOptions(opts,v){return opts.map(x=>'<option '+(x===(v||opts[0])?'selected':'')+'>'+esc(x)+'</option>').join('')}function openZone(i){d.activeZone=d.zones[i];go('zoneDetail')}function zoneField(k,v){let z=d.activeZone;d.zoneDetails=d.zoneDetails||{};if(k==='layout')planRecord(zoneData(z).layout,v);d.zoneDetails[z]={...zoneData(z),[k]:v};save();if(k==='photo')render()}function addZone(){let x=document.getElementById('zone').value.trim();if(x&&!d.zones.includes(x)){d.zones.push(x);save();openZone(d.zones.length-1)}}function deleteZone(){let z=d.activeZone;if(!confirm('Remove this zone and its notes/photo?'))return;d.zones=d.zones.filter(x=>x!==z);if(d.zoneDetails)delete d.zoneDetails[z];go('zones')}function zonePhoto(ev){let f=ev.target.files&&ev.target.files[0];if(!f)return;if(f.size>12000000){alert('Choose a smaller photo.');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,850/img.width,850/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{zoneField('photo',c.toDataURL('image/jpeg',0.6))}catch(e){alert('Browser storage is full. Try a smaller photo.')}};img.src=reader.result};reader.readAsDataURL(f)}function check(n){d.checks[n]=(d.checks[n]||0)+1;save();render()}function another(){d.adventure++;save();render()}function finish(){let t=current();if(t&&!d.done.includes(t[0]))d.done.push(t[0]);d.adventure=0;go('celebrate')}function render(){if(viewer3D){viewer3D.dispose();viewer3D=null}document.getElementById('app').innerHTML=screen();if(document.getElementById('garden3D'))setTimeout(initGarden3D,120)}render();</script></main></body></html>
